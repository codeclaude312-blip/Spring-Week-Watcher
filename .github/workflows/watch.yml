name: Spring Week Watcher

on:
  schedule:
    # alle 15 Minuten (Trackr-API erlaubt 100 Abrufe pro Tag)
    - cron: "*/15 * * * *"
  workflow_dispatch: # manuell starten über den "Run workflow"-Button

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trackr prüfen
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEASON: ${{ vars.SEASON }}
        run: python trackr_watcher.py

      - name: Zustand speichern
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "spring-week-watcher"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Zustand aktualisiert"
            git push
          fi
